<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ExpenseTracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">

    <!-- Brand Header -->
    <header class="auth-brand">
      <a href="index.html" class="auth-logo">
        <span class="auth-logo-icon">💸</span>
        <span class="auth-logo-text">ExpenseTracker</span>
      </a>
      <p class="auth-tagline">Track every rupee with clarity and confidence</p>
    </header>

    <!-- Main Login Card -->
    <main class="auth-card">

      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your personal expenses and income</p>
      </div>

      <!-- Alert Notification Banner -->
      <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>

        <!-- User ID / Email -->
        <div class="form-group">
          <label class="form-label" for="userid">User ID / Email</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="userid"
              name="userid"
              class="form-input"
              placeholder="Enter your email or username"
              autocomplete="username"
              autofocus
              required
            />
          </div>
        </div>

        <!-- Password with Show Password Toggle -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper has-toggle">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="btn-toggle-pwd"
              data-target="password"
              aria-label="Show password"
              title="Show password"
            >
              👁️
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-row-remember">
          <label class="remember-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgot-password-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="btn-login-submit">Log In</button>

      </form>

      <!-- Footer: Link to Register -->
      <footer class="auth-footer">
        <span>Don't have an account?</span>
        <a href="register.html" class="auth-footer-link">Register here</a>
      </footer>

    </main>

  </div>

  <!-- ===================== FORGOT PASSWORD MODAL ===================== -->
  <div class="auth-modal-backdrop" id="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="modal-forgot-title">
    <div class="auth-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-forgot-title">Reset Password</h2>
        <button type="button" class="btn-close-modal" id="btn-close-forgot" aria-label="Close modal">&times;</button>
      </div>
      <p class="modal-subtitle">Enter your registered email address and set your new password.</p>

      <div id="forgot-alert" class="auth-alert" role="alert" aria-live="polite"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reset-email">Registered Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="reset-email"
              class="form-input"
              placeholder="name@example.com"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-new-password">New Password</label>
          <div class="input-wrapper has-toggle">
            <input
              type="password"
              id="reset-new-password"
              class="form-input"
              placeholder="Minimum 6 characters"
              required
            />
            <button
              type="button"
              class="btn-toggle-pwd"
              data-target="reset-new-password"
              aria-label="Show password"
              title="Show password"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-password">Confirm New Password</label>
          <div class="input-wrapper has-toggle">
            <input
              type="password"
              id="reset-confirm-password"
              class="form-input"
              placeholder="Re-enter new password"
              required
            />
            <button
              type="button"
              class="btn-toggle-pwd"
              data-target="reset-confirm-password"
              aria-label="Show password"
              title="Show password"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" style="margin-top: 8px;">Save New Password</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/auth.js"></script>
</body>
</html>
